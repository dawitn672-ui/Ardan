name: check
# `push` is limited to main because a branch with an open pull request is already covered by the `pull_request` run:
# unfiltered, every push to such a branch ran the whole check twice (runs 48 and 49 of Oct 17, same commit, 85 minutes each).
on:
  push:
    branches: [main]
  pull_request:
# Only the newest commit on a ref is worth checking; a push that supersedes a running check cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Nine jobs side by side: eight test shards and the balance league (v2: 8 shards instead of 3, so a full run takes
# about 25 minutes, not an hour; the Great Continent league left with the Far Lands in v2 step 2): the build, linters and a third of the browser tests in each of three (tools/check.mjs
# --skip-balance --shard=k/3), the balance league in the fourth, and the Great Continent's league in the fifth (every path
# born in the Known World and in the Far Lands of one 2,033-province world: 6 lives a group for 25 years, about half an
# hour on four workers). As one job the whole check took 80 minutes, and the
# tests alone up to 104. Two shards ran 81 minutes each against a 120-minute timeout; three leave room for more tests.
# Round 2 A3a (CRITIQUE Q5): the build, the v2 engine's tests and every linter run once, in `build`; the eight shards
# only run browser tests, on the committed index.html that `build` proves current (each shard used to rebuild and relint).
jobs:
  build:
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium for ubuntu-latest (26.04) yet
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/check.mjs --skip-tests --skip-balance
  check:
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium for ubuntu-latest (26.04) yet
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/run.mjs index.html --workers=4 --shard=${{ matrix.shard }}/8
  balance:
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium for ubuntu-latest (26.04) yet
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/build.mjs
      - run: git diff --exit-code index.html
      - run: node tools/bench/balance.mjs index.html --workers=4
