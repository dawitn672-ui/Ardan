name: check
on:
  push:
  pull_request:
# Three jobs side by side: the build, linters and half the browser tests in each of two (tools/check.mjs --skip-balance
# --shard=k/2), the balance league in the third. As one job the whole check took 80 minutes, and the tests alone up to 104.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/check.mjs --skip-balance --shard=${{ matrix.shard }}/2
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/build.mjs
      - run: git diff --exit-code index.html
      - run: node bench/balance.mjs index.html --workers=4
