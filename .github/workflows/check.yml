name: check
# `push` is limited to main because a branch with an open pull request is already covered by the `pull_request` run:
# unfiltered, every push to such a branch ran the whole check twice (runs 48 and 49 of Oct 17, same commit, 85 minutes each).
on:
  push:
    branches: [main]
  pull_request:
# Only the newest commit on a ref is worth checking; a push that supersedes a running check cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Five jobs side by side: the build, linters and a third of the browser tests in each of three (tools/check.mjs
# --skip-balance --shard=k/3), the balance league in the fourth, and the Great Continent's league in the fifth (every path
# born in the Known World and in the Far Lands of one 2,033-province world: 6 lives a group for 25 years, about half an
# hour on four workers). As one job the whole check took 80 minutes, and the
# tests alone up to 104. Two shards ran 81 minutes each against a 120-minute timeout; three leave room for more tests.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/check.mjs --skip-balance --shard=${{ matrix.shard }}/3
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/build.mjs
      - run: git diff --exit-code index.html
      - run: node bench/balance.mjs index.html --workers=4
  balance-great:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/build.mjs
      - run: node bench/balance.mjs index.html --lands=great --workers=4
