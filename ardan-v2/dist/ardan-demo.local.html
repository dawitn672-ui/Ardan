<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Ardan Life Sim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one thumb-reach column. Status at the top, the life in the middle, one "Next month" button and five places at the bottom.
   Palette follows Ardan's Woodblock & Light system: washi paper by day, Prussian-blue night, gold for what you can touch, vermilion for seals. */
:root {
  --bg: #f2ede2; --surface: #faf7f0; --raised: #ffffff; --sunken: #e9e2d3; --line: #ddd3c0; --line-strong: #8c8270;
  --ink: #1d2033; --ink-2: #3a3e55; --ink-3: #5c6076;
  --gold: #7f5100; --gold-soft: #f3e2bd; --seal: #a82d1a; --seal-soft: #f6ddd6; --good: #2f6b3a; --good-soft: #dcebd9;
  --f-display: "Cinzel", "Trajan Pro", Georgia, serif; --f-body: "Literata", Georgia, serif; --f-ui: "Atkinson Hyperlegible", system-ui, sans-serif;
  --shadow: 0 10px 40px rgba(10, 13, 24, .25);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1120; --surface: #141a2c; --raised: #1b2338; --sunken: #0a0d18; --line: #2c3654; --line-strong: #6e7bab;
  --ink: #eee8da; --ink-2: #c4bfd2; --ink-3: #9a9cb8; --gold: #f0c062; --gold-soft: #2e2a22; --seal: #ff8a73; --seal-soft: #3a1f22; --good: #8fd29b; --good-soft: #1b3324; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1120; --surface: #141a2c; --raised: #1b2338; --sunken: #0a0d18; --line: #2c3654; --line-strong: #6e7bab;
  --ink: #eee8da; --ink-2: #c4bfd2; --ink-3: #9a9cb8; --gold: #f0c062; --gold-soft: #2e2a22; --seal: #ff8a73; --seal-soft: #3a1f22; --good: #8fd29b; --good-soft: #1b3324; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 1rem/1.55 var(--f-body); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button { font: 700 .95rem/1.2 var(--f-ui); color: var(--ink); background: var(--raised); border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 14px; cursor: pointer; min-height: 44px; }
button:hover { border-color: var(--gold); }
button.primary { background: var(--gold); color: var(--bg); border-color: var(--gold); }
button:disabled { opacity: .6; cursor: progress; }
h2 { font: 700 1.05rem/1.25 var(--f-display); letter-spacing: .06em; margin: 0 0 10px; text-wrap: balance; }
h3 { font: 700 .82rem/1.2 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
p { margin: 0 0 8px; }
.hint { color: var(--ink-3); font: 400 .88rem/1.45 var(--f-ui); }
.big { font: 600 1.15rem/1.4 var(--f-body); }
.warn { color: var(--seal); font-family: var(--f-ui); } .good { color: var(--good); font-family: var(--f-ui); }

/* start */
#start { min-height: 100%; display: grid; place-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.start-box { max-width: 30rem; display: grid; gap: 16px; }
.brand { font: 700 clamp(2.2rem, 8vw, 3.4rem)/1 var(--f-display); letter-spacing: .08em; color: var(--gold); margin: 0; }
.start-box label { display: grid; gap: 4px; font: 700 .85rem var(--f-ui); color: var(--ink-2); }
select, input { font: 400 1rem var(--f-ui); color: var(--ink); background: var(--raised); border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px; min-height: 44px; }

/* app frame */
#app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top-in { max-width: 46rem; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
#who { font: 700 1.05rem var(--f-display); letter-spacing: .04em; }
#when, #where { font: 400 .88rem var(--f-ui); color: var(--ink-3); font-variant-numeric: tabular-nums; }
#main { overflow-y: auto; padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { max-width: 46rem; margin: 0 auto; display: grid; gap: 22px; }
.view > section { display: grid; gap: 8px; min-width: 0; }
.bottom { background: var(--surface); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bottom-in { max-width: 46rem; margin: 0 auto; display: grid; gap: 10px; }
#next { width: 100%; font: 700 1.1rem var(--f-display); letter-spacing: .08em; min-height: 52px; background: var(--gold); color: var(--bg); border: 0; }
.tabs { display: flex; gap: 4px; }
.tabs button { flex: 1; min-width: 0; padding: 8px 4px; border: 0; background: none; font-size: .85rem; color: var(--ink-3); border-radius: 6px; }
.tabs button[aria-current="page"] { color: var(--gold); background: var(--gold-soft); }

/* plan and segmented controls */
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font-weight: 400; padding: 8px 12px; min-height: 40px; }
.seg button[aria-checked="true"] { background: var(--gold-soft); border-color: var(--gold); font-weight: 700; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }

/* life feed */
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.feed li { border-left: 3px solid var(--line); padding: 6px 12px; min-width: 0; }
.feed li p { margin: 0; overflow-wrap: anywhere; }
.feed .f-event { border-left-color: var(--gold); } .feed .f-news { border-left-color: var(--line-strong); } .feed .f-life { border-left-color: var(--seal); }
.f-when { display: inline-block; font: 700 .72rem var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-right: 8px; }
.f-tag { font: 700 .72rem var(--f-ui); color: var(--seal); }

/* stats as words */
.stat { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.stat-l { font: 700 .88rem var(--f-ui); color: var(--ink-2); grid-row: span 2; }
.stat-v { font: 600 1rem var(--f-body); font-variant-numeric: tabular-nums; }
.stat-w { font: 400 .86rem/1.4 var(--f-ui); color: var(--ink-3); min-width: 0; }

/* kin chips */
.kin-grid, .kin-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: 8px; }
.kin { display: grid; gap: 2px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.kin.me { border-color: var(--gold); background: var(--gold-soft); } .kin.dead { opacity: .62; }
.kin-rel { font: 700 .7rem var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.kin-name { font: 600 1rem var(--f-body); } .kin-meta { font: 400 .8rem var(--f-ui); color: var(--ink-3); }
.seal { justify-self: start; font: 700 .7rem/1.2 var(--f-ui); color: var(--seal); border: 1.5px solid var(--seal); background: var(--seal-soft); border-radius: 3px; padding: 3px 5px; margin-top: 3px; }
.gen { display: grid; gap: 6px; }

/* realms */
.realm { border-bottom: 1px solid var(--line); }
.realm summary { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; cursor: pointer; font: 700 .95rem var(--f-ui); }
.realm ul { margin: 0 0 10px; padding-left: 1.2rem; font: 400 .9rem var(--f-ui); color: var(--ink-2); }
.pill { font: 700 .75rem var(--f-ui); padding: 3px 8px; border-radius: 99px; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.p-allied, .p-closefriends, .p-friendly { background: var(--good-soft); color: var(--good); }
.p-atwar, .p-hostile, .p-uneasymarriagealliance, .p-cold { background: var(--seal-soft); color: var(--seal); }

/* map */
.map-wrap { position: relative; display: grid; gap: 6px; }
.map-view { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); aspect-ratio: 480 / 330; max-width: 100%; touch-action: none; cursor: grab; background: #0e2240; }
.map-canvas { width: 100%; height: 100%; display: block; transform-origin: 50% 50%; transition: transform .25s cubic-bezier(.2, .7, .2, 1); }
.clouds { position: absolute; inset: -20%; pointer-events: none; opacity: .5; mix-blend-mode: soft-light;
  background: radial-gradient(40% 25% at 20% 30%, rgba(255,255,255,.55), transparent 70%), radial-gradient(30% 20% at 70% 60%, rgba(255,255,255,.45), transparent 70%), radial-gradient(25% 18% at 45% 85%, rgba(255,255,255,.4), transparent 70%);
  animation: drift 90s linear infinite alternate; }
@keyframes drift { from { transform: translate(-6%, -2%); } to { transform: translate(6%, 3%); } }
.map-ctl { position: absolute; top: 8px; right: 8px; display: grid; gap: 6px; }
.map-ctl button { width: 44px; padding: 0; font-size: 1.2rem; background: color-mix(in srgb, var(--raised) 88%, transparent); }

/* war */
.two { grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 540px) { .two { grid-template-columns: 1fr; } }
.units { display: grid; gap: 6px; }
.unit { display: grid; grid-template-columns: 1fr; gap: 2px; font: 400 .9rem var(--f-ui); }
.unit.routed { opacity: .5; text-decoration: line-through; }
.bar { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; } .bar span { display: block; height: 100%; background: var(--gold); transition: width .4s ease; }

#toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 15; background: var(--ink); color: var(--bg); font: 400 .92rem var(--f-ui); padding: 10px 16px; border-radius: 99px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
#toast.show { animation: rise .26s cubic-bezier(.2, .8, .2, 1); }
.why p { font: 400 .9rem/1.45 var(--f-ui); color: var(--ink-2); margin: 0 0 6px; }
.unit.facing span:first-child { color: var(--seal); font-weight: 700; }
/* the card: events arrive one at a time */
#card { position: fixed; inset: 0; z-index: 20; display: grid; align-items: end; background: rgba(8, 10, 20, .45); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 700px) { #card { align-items: center; } }
.card { width: 100%; max-width: 34rem; margin: 0 auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 14px; max-height: 88vh; overflow-y: auto; }
.card.enter { animation: rise .26s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { transform: translateY(18px); opacity: .4; } to { transform: none; opacity: 1; } }
.card-kind { font: 700 .74rem var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--seal); margin: 0; }
.card-text { font: 400 1.08rem/1.6 var(--f-body); margin: 0; }
.card-count { font: 400 .8rem var(--f-ui); color: var(--ink-3); margin: 0; }
.card-acts { display: grid; gap: 8px; }
.choice { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; font-weight: 400; }
.choice-label { font: 700 .98rem var(--f-ui); }
.odds { display: inline-flex; align-items: center; gap: 6px; font: 700 .8rem var(--f-ui); color: var(--gold); white-space: nowrap; }
.odds-line { grid-column: 1 / -1; font: 400 .82rem var(--f-ui); color: var(--ink-3); }
.verdict { font: 700 .9rem var(--f-ui); margin: 0; } .v-win { color: var(--good); } .v-loss { color: var(--seal); }
.scale { position: relative; width: 22px; height: 14px; display: inline-block; }
.scale::after { content: ""; position: absolute; left: 10px; bottom: 0; width: 2px; height: 9px; background: currentColor; }
.scale .beam { position: absolute; left: 1px; right: 1px; top: 3px; height: 2px; background: currentColor; transform: rotate(var(--tilt)); transition: transform .3s; }
@media (prefers-reduced-motion: reduce) { .card.enter, .clouds, #toast.show { animation: none; } .map-canvas, .bar span, .scale .beam { transition: none; } }
</style>

<div id="start" hidden>
  <div class="start-box">
    <p class="brand">ARDAN</p>
    <p class="big">One life, lived a month at a time.</p>
    <p class="hint">You do not choose where you fall among your siblings, or whether you inherit. You choose what you do with the life you get.</p>
    <label for="estate">Born into
      <select id="estate"><option value="noble">a noble house</option><option value="gentry">a knightly family</option><option value="commoner">a common family</option></select></label>
    <label for="sex">As
      <select id="sex"><option value="any">a son or daughter, as fate decides</option><option value="male">a son</option><option value="female">a daughter</option></select></label>
    <label for="seed">World seed
      <input id="seed" value="tamar" autocomplete="off"></label>
    <button id="begin" class="primary">Begin a life</button>
  </div>
</div>

<div id="app" hidden>
  <header class="top"><div class="top-in"><span id="who"></span><span id="when"></span><span id="where"></span></div></header>
  <main id="main"></main>
  <nav class="bottom" aria-label="Places"><div class="bottom-in">
    <button id="next">Next month</button>
    <div class="tabs">
      <button data-tab="life">Life</button><button data-tab="you">You</button><button data-tab="family">Family</button><button data-tab="world">World</button><button data-tab="war" id="tab-war" hidden>War</button>
    </div>
  </div></nav>
</div>
<div id="toast" hidden role="status"></div>
<div id="card" hidden role="dialog" aria-modal="true" aria-label="This month"></div>
